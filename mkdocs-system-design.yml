site_name: ML Systems Design Notes
site_description: ML/LLM systems design notes covering MLOps, LLMOps, RAG, and production ML infrastructure.
docs_dir: system_design
site_dir: site-system-design

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - toc:
      permalink: true
  - tables

nav:
  - Overview: README.md
  - Other Tracks:
      - Algorithms & Data Structures: http://127.0.0.1:8000/
      - Distributed Systems Design: http://127.0.0.1:8002/
      - Security Engineering: http://127.0.0.1:8003/
  - Prerequisite Concepts:
      - "1. Performance & Scale": prerequisite_concepts/01_performance_and_scale.md
      - "2. Data & Consistency": prerequisite_concepts/02_data_and_consistency.md
      - "3. Communication & Resilience": prerequisite_concepts/03_communication_and_resilience.md
      - "4. CPU vs. GPU": prerequisite_concepts/04_cpu_vs_gpu.md
      - "5. Choosing a GPU & Code Optimization": prerequisite_concepts/05_gpu_selection_and_code_optimization.md
      - "6. Mechanical Sympathy & the Physics of Latency": prerequisite_concepts/06_mechanical_sympathy_and_physics_of_latency.md
      - "7. Saturation, Amdahl's Law & Hedged Requests": prerequisite_concepts/07_saturation_amdahls_law_and_hedged_requests.md
  - Tutorials:
      - 0. Interview Framework: 00_interview_framework/tutorial.md
      - 1. Fundamentals & Building Blocks: 01_fundamentals/tutorial.md
      - 2. High-Throughput Ingestion Pipelines:
          - Tutorial: 02_ingestion_pipeline/tutorial.md
          - "Deep-Dive: Lambda vs. EKS for Receipt Processing": 02_ingestion_pipeline/serverless_vs_eks_receipt_processing.md
      - 3. Feature Store & Model Promotion:
