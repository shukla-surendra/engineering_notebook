site_name: Security Engineering Notes
site_description: Cybersecurity, LLM security, and cloud/MLOps/LLMOps security — fundamentals, secure system design, and incident-debugging scenarios.
docs_dir: security
site_dir: site-security

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - toc:
      permalink: true
  - tables

nav:
  - Overview: README.md
  - Other Tracks:
      - Algorithms & Data Structures: http://127.0.0.1:8000/
      - ML Systems Design: http://127.0.0.1:8001/
      - Distributed Systems Design: http://127.0.0.1:8002/
      - Low-Level Design: http://127.0.0.1:8004/
  - Tutorials:
      - 0. Foundations (AppSec, Network, Crypto, IAM): 00_foundations/tutorial.md
      - 1. LLM Security: 01_llm_security/tutorial.md
      - 2. Cloud Security: 02_cloud_security/tutorial.md
      - 3. MLOps/LLMOps Security: 03_mlops_llmops_security/tutorial.md
      - 4. Security System Design:
          - Tutorial: 04_security_system_design/tutorial.md
          - "Case Study: Secure RAG Pipeline": 04_security_system_design/design_secure_rag_pipeline.md
          - "Case Study: Secure Multi-Tenant ML Platform": 04_security_system_design/design_secure_multi_tenant_ml_platform.md
  - Security Incident Scenarios:
      - Overview: 05_scenarios/README.md
      - "1. Leaked Cloud Credential via CI": 05_scenarios/01_leaked_cloud_credential_via_ci.md
      - "2. Indirect Prompt Injection Exfiltrated Internal Data": 05_scenarios/02_indirect_prompt_injection_exfiltration.md
      - "3. A Fine-Tuned Model Has a Backdoor Trigger": 05_scenarios/03_poisoned_training_data_backdoor.md
      - "4. Jailbreak Bypassed Guardrail in Production": 05_scenarios/04_jailbreak_bypassed_guardrail_in_prod.md
      - "5. An Agent's Tool Call Triggered SSRF": 05_scenarios/05_agent_tool_call_ssrf.md
      - "6. An Overprivileged Service Account Enabled Lateral Movement": 05_scenarios/06_overprivileged_service_account_lateral_movement.md
      - "7. Model Extraction via the Public Inference API": 05_scenarios/07_model_extraction_via_public_api.md
      - "8. A Compromised Dependency Shipped to Production": 05_scenarios/08_dependency_supply_chain_compromise.md
