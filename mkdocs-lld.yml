site_name: Low-Level Design Notes
site_description: Object-oriented / class design interview problems with patterns, class designs, and runnable solutions.
docs_dir: lld
site_dir: site-lld

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets:
      base_path: ["lld"]
      check_paths: true
  - pymdownx.highlight:
      anchor_linenums: true
  - toc:
      permalink: true
  - tables

nav:
  - Home: README.md
  - Other Tracks:
      - Algorithms & Data Structures: http://127.0.0.1:8000/
      - ML Systems Design: http://127.0.0.1:8001/
      - Distributed Systems Design: http://127.0.0.1:8002/
      - Security Engineering: http://127.0.0.1:8003/
  - Framework: OOD_FRAMEWORK.md
  - Problems:
      - "1. Parking Lot System": 01_parking_lot/problem.md
      - "2. Elevator System": 02_elevator_system/problem.md
      - "3. Vending Machine": 03_vending_machine/problem.md
      - "4. LRU Cache": 04_lru_cache/problem.md
      - "5. Rate Limiter": 05_rate_limiter/problem.md
